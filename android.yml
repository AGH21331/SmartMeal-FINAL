name: Smart Meal Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key (optional)
        if: ${{ secrets.SMARTMEAL_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.SMARTMEAL_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/smartmeal-upload.jks"
      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build Release AAB
        env:
          SMARTMEAL_KEYSTORE_PATH: ${{ runner.temp }}/smartmeal-upload.jks
          SMARTMEAL_KEYSTORE_PASSWORD: ${{ secrets.SMARTMEAL_KEYSTORE_PASSWORD }}
          SMARTMEAL_KEY_ALIAS: ${{ secrets.SMARTMEAL_KEY_ALIAS }}
          SMARTMEAL_KEY_PASSWORD: ${{ secrets.SMARTMEAL_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartmeal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smartmeal-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
